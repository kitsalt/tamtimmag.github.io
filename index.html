<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>timtam</title>

    <!-- Google Model Viewer -->
    <script type="module"
        src="https://unpkg.com/@google/model-viewer/dist/model-viewer.min.js">
    </script>

    <style>
        html, body {
            margin: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: #fcffbf;
        }

        model-viewer {
            width: 100%;
            height: 100%;
        }

        #ar-button {
            position: absolute;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            padding: 12px 24px;
            background: #6be051;
            color: #2a4021;
            border: 10px;
            border-radius: 10px;
            border-color: white;
            font-size: 16px;
            font-family: "Comic Sans MS", "Comic Sans";
            cursor: pointer;
        }
    </style>
</head>

<body>

    <model-viewer
        src="model.glb"
        ios-src="model.usdz"
        ar
        ar-modes="quick-look webxr scene-viewer"
        camera-controls
        tone-mapping="neutral"
        shadow-intensity="1"
        alt="A 3D model">

        <button id="ar-button" slot="ar-button">
            Invite Tim to your space!
        </button>

    </model-viewer>

</body>
</html>
